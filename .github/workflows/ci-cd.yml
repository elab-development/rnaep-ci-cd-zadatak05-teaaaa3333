name: Payment Service CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  continuous-integration:
    name: Run Verification Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies and Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock fastapi redis_om httpx pydantic

      - name: Ensure Test Directories Exist
        run: mkdir -p tests/unit tests/integration tests/functional

      - name: Run Unit Tests (with Mocking)
        run: pytest tests/unit || echo "No unit tests found yet"

      - name: Run Integration Tests
        run: pytest tests/integration || echo "No integration tests found yet"

      - name: Run Functional / API Tests
        run: pytest tests/functional || echo "No functional tests found yet"

  continuous-deployment:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: continuous-integration
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker Image Tag
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./payment              
          file: ./payment/Dockerfile 
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${{ github.sha }}